  # ------------ Firebase ----------
  firebase_core: ^3.5.0
  firebase_remote_config: ^5.1.2
  firebase_crashlytics: ^4.1.2
  

  # ---------- Local Storage ----------
  shared_preferences: ^2.3.2



  # ---------- Localization ----------
