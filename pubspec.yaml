  # ------------ Security -------------
  flutter_secure_storage: ^9.2.2
  go_router: ^17.5.0
  lucide_icons_flutter: ^4.0.3
  fl_chart: ^1.3.1
  image_picker: ^1.2.4
  intl: ^0.20.2
  equatable: ^3.0.0
  firebase_messaging: ^15.2.10
  path_provider: ^2.1.6
  open_filex: ^5.0.0
